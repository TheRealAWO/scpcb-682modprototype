name: Build SCP-682 Prototype

on:
  workflow_dispatch:
  push:
    branches:
      - prototype/scp-682-player
    paths:
      - '**.bb'
      - '**.decls'
      - '**.dll'
      - 'mavless_bin.zip'
      - 'tools/patch_682_source.ps1'
      - '.github/workflows/build-scp682-prototype.yml'

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Apply SCP-682 integration patch
        shell: powershell
        run: |
          ./tools/patch_682_source.ps1

      - name: Prepare Containment Breach mavless Blitz3D compiler
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'mavless_bin.zip')) { throw 'Repository mavless_bin.zip is missing.' }

          $tool = Join-Path $env:RUNNER_TEMP 'cb_mavless_blitz3d'
          if (Test-Path $tool) { Remove-Item $tool -Recurse -Force }
          New-Item -ItemType Directory -Path $tool -Force | Out-Null
          Expand-Archive -Path 'mavless_bin.zip' -DestinationPath $tool -Force

          $ccFile = Get-ChildItem -Path $tool -Recurse -File -Filter 'blitzcc.exe' | Select-Object -First 1
          if (-not $ccFile) { throw 'mavless_bin.zip did not contain blitzcc.exe.' }

          $binDir = $ccFile.Directory.FullName
          $blitzRoot = Split-Path $binDir -Parent
          $userlibs = Join-Path $blitzRoot 'userlibs'
          New-Item -ItemType Directory -Path $userlibs -Force | Out-Null
          Get-ChildItem -Path . -File -Filter '*.decls' | Copy-Item -Destination $userlibs -Force
          Get-ChildItem -Path . -File -Filter '*.dll'   | Copy-Item -Destination $userlibs -Force

          $env:blitzpath = $blitzRoot
          "BLITZCC=$($ccFile.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BLITZPATH=$blitzRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BLITZBIN=$binDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Blitz root: $blitzRoot"
          Write-Host "Compiler: $($ccFile.FullName)"
          Get-ChildItem $binDir | Select-Object Name,Length | Format-Table

          $dump = Get-ChildItem 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC' -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'Hostx64\\x64\\dumpbin.exe$' } | Select-Object -First 1
          if ($dump) {
            Write-Host '--- runtime.dll dependencies ---'
            & $dump.FullName /dependents (Join-Path $binDir 'runtime.dll')
            Write-Host '--- linker.dll dependencies ---'
            & $dump.FullName /dependents (Join-Path $binDir 'linker.dll')
          }

      - name: Compile executable
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:blitzpath = $env:BLITZPATH
          $repoRoot = $PWD.Path
          $output = Join-Path $repoRoot 'SCP-682 Containment Breach Prototype.exe'
          $source = Join-Path $repoRoot 'Main.bb'
          Push-Location $env:BLITZBIN
          try {
            & $env:BLITZCC +q -o $output $source
            $code = $LASTEXITCODE
          }
          finally {
            Pop-Location
          }
          if ($code -ne 0) { exit $code }
          if (-not (Test-Path $output)) { throw 'Compiler returned success but no executable was produced.' }
          Get-Item $output | Format-List Name,Length,LastWriteTime
          Get-FileHash -Path $output -Algorithm SHA256 | Format-List

      - name: Assemble and validate portable directory
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $PWD 'dist\SCP682_CB_Prototype'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null

          Copy-Item 'SCP-682 Containment Breach Prototype.exe' $stage -Force
          Copy-Item 'options.ini' $stage -Force
          Copy-Item 'ReadMe.txt' $stage -Force
          Copy-Item 'Credits.txt' $stage -Force
          if (Test-Path 'Instructions.txt') { Copy-Item 'Instructions.txt' $stage -Force }
          if (Test-Path 'Changelog.txt') { Copy-Item 'Changelog.txt' $stage -Force }
          if (Test-Path 'LICENSE') { Copy-Item 'LICENSE' $stage -Force }
          if (Test-Path 'LICENSE.txt') { Copy-Item 'LICENSE.txt' $stage -Force }
          Copy-Item '*.dll' $stage -Force
          Copy-Item 'Data' $stage -Recurse -Force
          Copy-Item 'GFX' $stage -Recurse -Force
          Copy-Item 'SFX' $stage -Recurse -Force
          Copy-Item 'Loadingscreens' $stage -Recurse -Force

          @'
          @echo off
          cd /d "%~dp0"
          start "" "SCP-682 Containment Breach Prototype.exe"
          '@ | Set-Content -Path (Join-Path $stage 'RUN_SCP682.cmd') -Encoding ascii

          @'
          SCP-682 // CONTAINMENT BREACH PROTOTYPE

          IMPORTANT: extract the whole ZIP before launching. Do not run the EXE from
          inside the ZIP archive and do not move the EXE away from Data/GFX/SFX.

          Recommended launch: RUN_SCP682.cmd

          CONTROLS
          LMB  Slash
          RMB  Maul
          R    Charge
          Q    Body Slam
          F    Roar
          C    Adaptive Rage
          E    Interact with doors
          WASD Move
          Shift Sprint

          This build uses SCP: Containment Breach's repository-provided mavless
          Blitz3D compiler/runtime target rather than the newer SoLoud fork.
          The derivative remains subject to the original project's CC BY-SA 3.0
          licensing/attribution requirements. See ReadMe.txt and Credits.txt.
          '@ | Set-Content -Path (Join-Path $stage 'SCP682_README.txt')

          $critical = @(
            'SCP-682 Containment Breach Prototype.exe',
            'fmod.dll',
            'zlibwapi.dll',
            'options.ini',
            'GFX\cursor.png',
            'GFX\menu\startup_TSS.avi',
            'GFX\menu\startup_Undertow.avi',
            'Loadingscreens\loadingback.jpg',
            'Loadingscreens\loadingscreens.ini',
            'Data\rooms.ini',
            'Data\NPCs.ini'
          )
          foreach ($rel in $critical) {
            $p = Join-Path $stage $rel
            if (-not (Test-Path $p)) { throw "Portable build is missing critical runtime file: $rel" }
          }
          Write-Host 'Portable runtime validation passed.'

      - name: Upload executable only
        uses: actions/upload-artifact@v4
        with:
          name: SCP682-Prototype-Mavless-EXE
          path: SCP-682 Containment Breach Prototype.exe
          if-no-files-found: error
          compression-level: 0

      - name: Upload playable build
        uses: actions/upload-artifact@v4
        with:
          name: SCP682-Containment-Breach-Prototype-Mavless-Portable
          path: dist/SCP682_CB_Prototype
          if-no-files-found: error
          compression-level: 6
