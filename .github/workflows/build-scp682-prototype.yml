name: Build SCP-682 Prototype

on:
  workflow_dispatch:
  push:
    branches:
      - prototype/scp-682-player
    paths:
      - '**.bb'
      - '**.decls'
      - '**.dll'
      - 'tools/patch_682_source.ps1'
      - '.github/workflows/build-scp682-prototype.yml'

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Apply SCP-682 integration patch
        shell: powershell
        run: |
          ./tools/patch_682_source.ps1

      - name: Cache open-source Blitz3D toolchain
        id: cache-blitz
        uses: actions/cache@v4
        with:
          path: D:\a\_temp\blitz3d_toolchain
          key: blitz3d-soloud-win32-v11-19-20260815

      - name: Prepare current open-source Blitz3D compiler
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tool = 'D:\a\_temp\blitz3d_toolchain'
          $blitzRoot = Join-Path $tool 'BLITZ3D_INSTALL'
          $cc = Join-Path $blitzRoot 'bin\blitzcc.exe'

          if (-not (Test-Path $cc)) {
            $src = Join-Path $env:RUNNER_TEMP 'blitz3d_soloud_src'
            $build = Join-Path $src 'cmake-build-release'
            if (Test-Path $src) { Remove-Item $src -Recurse -Force }
            if (Test-Path $tool) { Remove-Item $tool -Recurse -Force }

            git clone --depth 1 https://github.com/blitz-research/blitz3d_soloud.git $src
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            cmake -S $src -B $build -A Win32 -G "Visual Studio 17 2022"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cmake --build $build --config Release --parallel 2
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            New-Item -ItemType Directory -Path $tool -Force | Out-Null
            Copy-Item (Join-Path $src 'BLITZ3D_INSTALL') $tool -Recurse -Force
          }

          $userlibs = Join-Path $blitzRoot 'userlibs'
          New-Item -ItemType Directory -Path $userlibs -Force | Out-Null
          Get-ChildItem -Path . -File -Filter '*.decls' | Copy-Item -Destination $userlibs -Force
          Get-ChildItem -Path . -File -Filter '*.dll'   | Copy-Item -Destination $userlibs -Force

          $env:blitzpath = $blitzRoot
          "BLITZCC=$cc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BLITZPATH=$blitzRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $cc -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile executable
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:blitzpath = $env:BLITZPATH
          $output = Join-Path $PWD 'SCP-682 Containment Breach Prototype.exe'
          & $env:BLITZCC +q -o $output (Join-Path $PWD 'Main.bb')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path $output)) { throw 'Compiler returned success but no executable was produced.' }
          Get-Item $output | Format-List Name,Length,LastWriteTime
          Get-FileHash -Path $output -Algorithm SHA256 | Format-List

      - name: Assemble playable directory
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $PWD 'dist\SCP682_CB_Prototype'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null

          Copy-Item 'SCP-682 Containment Breach Prototype.exe' $stage -Force
          Copy-Item 'options.ini' $stage -Force
          Copy-Item 'ReadMe.txt' $stage -Force
          Copy-Item 'Credits.txt' $stage -Force
          if (Test-Path 'Changelog.txt') { Copy-Item 'Changelog.txt' $stage -Force }
          if (Test-Path 'LICENSE') { Copy-Item 'LICENSE' $stage -Force }
          if (Test-Path 'LICENSE.txt') { Copy-Item 'LICENSE.txt' $stage -Force }
          Copy-Item '*.dll' $stage -Force

          Copy-Item 'Data' $stage -Recurse -Force
          Copy-Item 'GFX' $stage -Recurse -Force
          Copy-Item 'SFX' $stage -Recurse -Force
          Copy-Item 'Loadingscreens' $stage -Recurse -Force

          @'
          SCP-682 // CONTAINMENT BREACH PROTOTYPE

          Experimental source modification of SCP: Containment Breach using the
          original game's rooms, assets, map/event systems, NPCs, audio, collision
          and rendering. The 682 implementation is currently a gameplay proof of
          concept; a final rigged first-person character model is not included yet.

          CONTROLS
          LMB  Slash
          RMB  Maul
          R    Charge
          Q    Body Slam
          F    Roar
          C    Adaptive Rage
          E    Interact with doors
          WASD Move
          Shift Sprint

          This derivative remains subject to the original project's CC BY-SA 3.0
          licensing/attribution requirements. See ReadMe.txt and Credits.txt.
          '@ | Set-Content -Path (Join-Path $stage 'SCP682_README.txt')

      - name: Upload executable only
        uses: actions/upload-artifact@v4
        with:
          name: SCP682-Prototype-EXE
          path: SCP-682 Containment Breach Prototype.exe
          if-no-files-found: error
          compression-level: 0

      - name: Upload playable build
        uses: actions/upload-artifact@v4
        with:
          name: SCP682-Containment-Breach-Prototype-Portable
          path: dist/SCP682_CB_Prototype
          if-no-files-found: error
          compression-level: 6
